name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 사이트 결과물과 무관한 파일만 바뀐 push 는 배포하지 않는다.
    # 제외 목록 방식이라, 새 파일이 생겨도 기본은 배포된다. 수동 배포는 workflow_dispatch.
    paths:
      - '**'
      - '!scripts/**'
      - '!dev-docs/**'
      - '!.github/**'
      - '.github/workflows/deploy.yml'
      - '!*.md'
      - '!.gitignore'
      - '!.notion-translate-hashes.json'
      - '!**/.notion-sync.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 진행 중인 배포는 완료, 대기 중인 것은 최신 1개만 유지
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.cache
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build (production, all locales)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
