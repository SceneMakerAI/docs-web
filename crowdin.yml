project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: .
preserve_hierarchy: true

files:
  # 문서 Markdown (KR 원본 → EN 번역)
  - source: /docs/**/*.md
    translation: /i18n/en/docusaurus-plugin-content-docs/current/**/%original_file_name%

  # 사이드바 카테고리 레이블 JSON
  - source: /docs/**/_category_.json
    translation: /i18n/en/docusaurus-plugin-content-docs/current/**/_category_.json

  # 블로그 포스트
  - source: /blog/[0-9]*.md
    translation: /i18n/en/docusaurus-plugin-content-blog/**/%original_file_name%

  # UI 문자열 (네비바, 푸터, 블로그 옵션 등)
  - source: /i18n/en/docusaurus-theme-classic/navbar.json
    translation: /i18n/en/docusaurus-theme-classic/navbar.json
  - source: /i18n/en/docusaurus-theme-classic/footer.json
    translation: /i18n/en/docusaurus-theme-classic/footer.json
  - source: /i18n/en/docusaurus-plugin-content-blog/options.json
    translation: /i18n/en/docusaurus-plugin-content-blog/options.json
